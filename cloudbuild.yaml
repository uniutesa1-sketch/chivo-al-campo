# ==============================================================================
# CLOUD BUILD CONFIGURATION - RESTAURANTE CHIVO AL CAMPO
# Automatización CI/CD para Google Cloud Build -> Google Cloud Run (HTTPS)
# ==============================================================================

steps:
  # ----------------------------------------------------------------------------
  # Paso 1: Construir la imagen Docker
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/chivo-al-campo:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/chivo-al-campo:latest'
      - '.'

  # ----------------------------------------------------------------------------
  # Paso 2: Subir la imagen Docker a Google Container Registry
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/chivo-al-campo:latest'

  # ----------------------------------------------------------------------------
  # Paso 3: Desplegar el contenedor en Google Cloud Run con HTTPS nativo
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'chivo-al-campo'
      - '--image'
      - 'gcr.io/$PROJECT_ID/chivo-al-campo:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

# Imágenes a almacenar en el registro de Google Cloud
images:
  - 'gcr.io/$PROJECT_ID/chivo-al-campo:latest'
  - 'gcr.io/$PROJECT_ID/chivo-al-campo:$SHORT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY

